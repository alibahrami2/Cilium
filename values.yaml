global:
  registry: kube.aradarpanet.ir

kubeProxyReplacement: true

k8sServiceHost: 192.168.102.104
k8sServicePort: 6443

image:
  repository: kube.aradarpanet.ir/cilium/cilium
  tag: v1.19.3
  pullPolicy: IfNotPresent
  useDigest: false

operator:
  replicas: 2
  image:
    repository: kube.aradarpanet.ir/cilium/operator
    tag: v1.19.3
    pullPolicy: IfNotPresent
    useDigest: false

gatewayAPI:
  enabled: true

envoy:
  enabled: true
  image:
    repository: kube.aradarpanet.ir/cilium/cilium-envoy
    tag: v1.34.10-1762597008-ff7ae7d623be00078865cff1b0672cc5d9bfc6d5
    pullPolicy: IfNotPresent
    useDigest: false

certgen:
  image:
    repository: kube.aradarpanet.ir/cilium/certgen
    tag: v0.2.4
    pullPolicy: IfNotPresent
    useDigest: false

hubble:
  enabled: true
  relay:
    enabled: true
    gops:
      enabled: false
    image:
      repository: kube.aradarpanet.ir/cilium/hubble-relay
      tag: v1.19.3
      pullPolicy: IfNotPresent
      useDigest: false
  ui:
    enabled: true
    frontend:
      image:
        repository: kube.aradarpanet.ir/cilium/hubble-ui
        tag: v0.13.3
        pullPolicy: IfNotPresent
        useDigest: false
    backend:
      image:
        repository: kube.aradarpanet.ir/cilium/hubble-ui-backend
        tag: v0.13.3
        pullPolicy: IfNotPresent
        useDigest: false

cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d

enableIPv4Masquerade: true

bpf:
  masquerade: true

kubeProxyReplacementHealthzBindAddr: "0.0.0.0:10256"

securityContext:
  privileged: true

nodeinit:
  enabled: false

clustermesh:
  useAPIServer: false

tls:
  enabled: false

authentication:
  mutual:
    spire:
      enabled: false

imagePullSecrets: []
